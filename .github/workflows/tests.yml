name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r moodle_sync/requirements.txt -r discord_courses/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s moodle_sync -v
      - run: python -m unittest discover -s discord_courses -v
